<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Data Anggota</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background-color: #f4f4f9; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
        input, button { padding: 10px; margin: 5px 0; width: 100%; box-sizing: border-box; }
        button { background: #28a745; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background: #218838; }
        button.btn-delete { background: #dc3545; padding: 5px 10px; width: auto; font-size: 12px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        table, th, td { border: 1px solid #ddd; }
        th, td { padding: 10px; text-align: left; }
        th { background: #007bff; color: white; }
    </style>
</head>
<body>

    <h2>Aplikasi Pendataan Anggota</h2>

    <!-- Form Tambah Data -->
    <div class="card">
        <h3>Tambah Anggota Baru</h3>
        <input type="text" id="inputNama" placeholder="Nama Lengkap" required>
        <input type="number" id="inputHp" placeholder="Nomor HP / WA" required>
        <input type="text" id="inputAlamat" placeholder="Alamat" required>
        <button id="btnSimpan" onclick="simpanAnggota()">Simpan Data</button>
    </div>

    <!-- Tabel Menampilkan Data -->
    <div class="card">
        <h3>Daftar Anggota</h3>
        <button onclick="ambilData()" style="background-color: #007bff; width: auto; padding: 8px 15px;">🔄 Refresh Data</button>
        <table id="tabelAnggota">
            <thead>
                <tr>
                    <th>Nama</th>
                    <th>No. HP</th>
                    <th>Alamat</th>
                    <th>Aksi</th>
                </tr>
            </thead>
            <tbody>
                <tr><td colspan="4">Silakan klik "Refresh Data"</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        // MASUKKAN URL GOOGLE APPS SCRIPT ANDA DI SINI
        const SCRIPT_URL = "URL_WEB_APP_ANDA_DISINI";

        // ==========================================
        // FUNGSI 1: MENGAMBIL (READ) DATA
        // ==========================================
        async function ambilData() {
            const tbody = document.querySelector("#tabelAnggota tbody");
            tbody.innerHTML = `<tr><td colspan="4">⏳ Mengambil data...</td></tr>`;

            try {
                // Gunakan URL dengan parameter action=get_anggota
                let response = await fetch(`${SCRIPT_URL}?action=get_anggota`);
                let result = await response.json();

                if (result.status === "success") {
                    tbody.innerHTML = ""; // Bersihkan tabel
                    
                    if (result.data.length === 0) {
                        tbody.innerHTML = `<tr><td colspan="4">Belum ada data anggota.</td></tr>`;
                        return;
                    }

                    result.data.forEach(item => {
                        let row = `<tr>
                            <td>${item.nama}</td>
                            <td>${item.hp}</td>
                            <td>${item.alamat}</td>
                            <td>
                                <button class="btn-delete" onclick="hapusAnggota(${item.noUrut}, '${item.nama}')">Hapus</button>
                            </td>
                        </tr>`;
                        tbody.innerHTML += row;
                    });
                }
            } catch (e) {
                tbody.innerHTML = `<tr><td colspan="4" style="color:red;">❌ Gagal mengambil data. Pastikan URL Script benar.</td></tr>`;
            }
        }

        // ==========================================
        // FUNGSI 2: MENYIMPAN (CREATE) DATA
        // ==========================================
        async function simpanAnggota() {
            let nama = document.getElementById('inputNama').value;
            let hp = document.getElementById('inputHp').value;
            let alamat = document.getElementById('inputAlamat').value;
            let btn = document.getElementById('btnSimpan');

            if(!nama || !hp || !alamat) return alert("Semua kolom wajib diisi!");

            btn.innerHTML = "⏳ Menyimpan...";
            btn.disabled = true;

            let payload = {
                action: "simpan_anggota",
                nama: nama,
                hp: hp,
                alamat: alamat
            };

            try {
                let response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    redirect: 'follow', // PENTING: Untuk Google Script
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // PENTING: Mencegah error CORS
                    body: JSON.stringify(payload)
                });
                
                let result = await response.json();
                
                if (result.status === "success") {
                    alert(result.message);
                    document.getElementById('inputNama').value = "";
                    document.getElementById('inputHp').value = "";
                    document.getElementById('inputAlamat').value = "";
                    ambilData(); // Otomatis refresh tabel
                } else {
                    alert("Error: " + result.message);
                }
            } catch (e) {
                alert("Gagal menghubungi server!");
            }

            btn.innerHTML = "Simpan Data";
            btn.disabled = false;
        }

        // ==========================================
        // FUNGSI 3: MENGHAPUS (DELETE) DATA
        // ==========================================
        async function hapusAnggota(barisDiSheet, namaLengkap) {
            if(!confirm(`Yakin ingin menghapus data anggota: ${namaLengkap}?`)) return;

            try {
                let payload = {
                    action: "hapus_anggota",
                    no: barisDiSheet
                };

                let response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    redirect: 'follow', // PENTING
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // PENTING
                    body: JSON.stringify(payload)
                });
                
                let result = await response.json();
                
                if (result.status === "success") {
                    alert(result.message);
                    ambilData(); // Otomatis refresh tabel setelah hapus
                }
            } catch (e) {
                alert("Gagal menghapus data!");
            }
        }

        // Otomatis load data saat web pertama kali dibuka
        window.onload = ambilData;
    </script>
</body>
</html>
